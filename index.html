<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2457d6">
<title>Quản lý đơn hàng</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">📦 Đơn hàng TTS</div>
  <nav id="tabs"></nav>
  <details id="usermenu" class="more um" hidden>
    <summary><span id="me"></span> ▾</summary>
    <div class="menu">
      <div id="sync" class="sync"></div>
      <a href="huong-dan/" target="_blank" rel="noopener">Hướng dẫn sử dụng</a>
      <button id="logout" hidden>Đăng xuất</button>
    </div>
  </details>
</header>
<main id="main"></main>
<div id="login" class="login" hidden>
  <form id="login-form" autocomplete="off">
    <h2>📦 Đơn hàng TTS</h2>
    <p>Nhập mật khẩu được cấp cho vai trò của bạn.</p>
    <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" autofocus>
    <div id="login-err" class="err"></div>
    <button class="btn pri" type="submit">Đăng nhập</button>
  </form>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="billing.js"></script>
<script src="app.js"></script>
</body>
</html>
